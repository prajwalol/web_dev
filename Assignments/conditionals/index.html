<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conditionals Practice</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(15, 23, 42, 0.78);
            --accent: #22c55e;
            --accent-2: #38bdf8;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.25), transparent 35%),
                linear-gradient(135deg, #020617, #0f172a 45%, #111827);
            color: var(--text);
            padding: 32px 16px;
        }

        .app-shell {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 2.2rem;
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            margin-top: 0;
            color: #f8fafc;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            margin-bottom: 12px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 700;
            color: #001f1f;
            background: linear-gradient(135deg, var(--accent), #86efac);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
        }

        .result {
            min-height: 42px;
            margin-top: 14px;
            color: #86efac;
            font-weight: 700;
        }

        pre {
            margin: 0;
            background: rgba(3, 7, 18, 0.8);
            border-radius: 14px;
            padding: 16px;
            white-space: pre-wrap;
            color: #bae6fd;
            border: 1px solid rgba(56, 189, 248, 0.28);
        }

        .full-width {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <main class="app-shell">
        <h1>JavaScript Conditionals Practice</h1>

        <section class="grid">
            <div class="card">
                <h2>1. Even or Odd Checker</h2>
                <label for="even-odd-input">Enter a number:</label>
                <input type="number" id="even-odd-input" placeholder="e.g. 7" />
                <button id="check-even-odd">Check Even / Odd</button>
                <p class="result" id="even-odd-result"></p>
            </div>

            <div class="card">
                <h2>2. Multiplication Table</h2>
                <label for="table-input">Enter a number:</label>
                <input type="number" id="table-input" placeholder="e.g. 5" />
                <button id="generate-table">Generate Table</button>
                <pre id="table-result"></pre>
            </div>
        </section>

        <section class="card full-width">
            <h2>More Practice Output</h2>
            <pre id="output"></pre>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
