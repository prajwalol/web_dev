<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">My Website</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavbar"
        aria-controls="siteNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="siteNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a></li>
          <li class="nav-item"><a class="nav-link" href="photos.html">Photos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-card">
    <h2>Feedback Form</h2>
    <hr />

    <form id="feedback-form" method="post" action="#">
      <label for="fullname">Full Name</label>
      <br />
      <input type="text" placeholder="Enter your full name" name="fullname" id="fullname" required minlength="3"
        maxlength="50" />
      <br /><br />

      <label for="email">Email Address</label>
      <br />
      <input type="email" placeholder="Enter your email" name="email" id="email" required />
      <br /><br />

      <p>Select your satisfaction level:</p>
      <input type="radio" name="rating" id="very-satisfied" value="very-satisfied" required />
      <label for="very-satisfied">Very Satisfied</label>
      <br />
      <input type="radio" name="rating" id="satisfied" value="satisfied" />
      <label for="satisfied">Satisfied</label>
      <br />
      <input type="radio" name="rating" id="neutral" value="neutral" />
      <label for="neutral">Neutral</label>
      <br />
      <input type="radio" name="rating" id="unsatisfied" value="unsatisfied" />
      <label for="unsatisfied">Unsatisfied</label>
      <br /><br />

      <p>Select your areas of interest:</p>
      <input type="checkbox" name="interests" id="web-dev" value="web-development" />
      <label for="web-dev">Web Development</label>
      <br />
      <input type="checkbox" name="interests" id="mobile-dev" value="mobile-development" />
      <label for="mobile-dev">Mobile Development</label>
      <br />
      <input type="checkbox" name="interests" id="ai-ml" value="ai-machine-learning" />
      <label for="ai-ml">AI & Machine Learning</label>
      <br /><br />

      <label for="country">Country</label>
      <br />
      <select name="country" id="country" required>
        <option value="">--Select your country--</option>
        <option value="nepal">Nepal</option>
        <option value="us">United States</option>
        <option value="canada">Canada</option>
        <option value="uk">United Kingdom</option>
      </select>
      <br /><br />

      <label for="feedback-message">Write your feedback here</label>
      <br />
      <textarea name="feedback" id="feedback-message" placeholder="Type your message here..." rows="5" cols="40"
        required minlength="10" maxlength="500"></textarea>
      <br /><br />

      <input type="submit" value="Submit" />
    </form>

    <hr />
    <p>
      <a href="index.html">Home</a> | <a href="photos.html">Photos</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
